schema: spec-driven

context: |
  Спецификации интеграции `mtdx62` для датчиков присутствия MTD062-MB и MTD262-MB.

  Здесь только требования этой интеграции: мастер настройки, сущности, поведение при
  недоступности, диагностика. Сквозные правила (транспорт Modbus, доступность, идентичность
  сущностей, локализация, диагностика, упаковка) — в `openspec/specs/conventions/` в корне
  рабочего пространства; здесь на них ссылаются, а не копируют.

  Требования к библиотеке протокола — в `libraries/mtdx62-modbus-library/openspec/`. Интеграция потребляет
  её контракт и не описывает разбор регистров у себя.

  Факты об устройстве и карта регистров — `docs/DEVICE-FACTS.md` в репозитории библиотеки
  `mtdx62-modbus-library`; здесь они не дублируются.
  Правила проекта — `AGENTS.md` в корне рабочего пространства.

  Стек: Python 3.14, Home Assistant 2026.11+, Modbus через интеграцию `modbus` ядра.
  Язык: артефакты на русском; заголовки OpenSpec, SHALL/MUST и код — на английском.

rules:
  proposal:
    - "Указать, какие сквозные требования из openspec/specs/conventions/ применяются, и какие
      правила Integration Quality Scale закрывает изменение."
    - "Отдельно назвать библиотеку, от которой зависит интеграция, и её версию."
  specs:
    - "Требования формулируются в терминах Home Assistant: состояния сущностей, шаги мастера,
      ошибки, repair issues, диагностика. Адреса регистров и разбор значений — зона библиотеки;
      здесь допустимы только ссылки на её контракт."
    - "Значения, единицы и категории сущностей указываются явно: они видны пользователю."
  design:
    - "Показать, как интеграция получает юнит у интеграции modbus и что делает при недоступности;
      собственный транспорт не описывать — его нет."
  tasks:
    - "Тесты идут в группе той реализации, которую проверяют."
    - "Отдельной группы «финальная проверка» быть не должно."
    - "Задачи на библиотеку здесь не ставятся: у неё свой корень спецификаций и своё изменение."

operations:
  apply:
    guidance:
      - "Перед кодом прочитать conventions из корня рабочего пространства и DEVICE-FACTS.md."
